name: Deploy PulseLive Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Load env from server
        run: cp /home/ubuntu/pulse/pulseLive-Frontend/.env .env

      # Setup pnpm (only for build)
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      # Setup Node
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm run build

 
      - name: Sync to production directory
        run: |
          mkdir -p /home/ubuntu/pulse/pulseLive-Frontend/dist
          rsync -av --delete dist/ /home/ubuntu/pulse/pulseLive-Frontend/dist/
          rsync -av package.json /home/ubuntu/pulse/pulseLive-Frontend/   
          rsync -av server.ts /home/ubuntu/pulse/pulseLive-Frontend/

      - name: Restart service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart pulselive-dashboard-dev
